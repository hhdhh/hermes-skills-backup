# ~/.ssh/config 优化模板
# 保存到 ~/.ssh/config（chmod 600）

# === 全局默认 ===
Host *
  ServerAliveInterval 30
  ServerAliveCountMax 3
  TCPKeepAlive yes
  Compression yes
  HashKnownHosts yes
  AddKeysToAgent yes
  UseKeychain yes
  IdentityFile ~/.ssh/id_ed25519
  IdentitiesOnly yes
  StrictHostKeyChecking accept-new

# === 单主机示例 ===
# 内网机器人控制器
Host robot-arm
  HostName 192.168.10.2
  User nvidia
  Port 22
  IdentityFile ~/.ssh/id_ed25519

# 跳板后再连目标（堡垒机模式）
Host target-via-bastion
  HostName 10.0.0.5
  User your_user
  ProxyJump bastion
  IdentityFile ~/.ssh/id_ed25519

Host bastion
  HostName jump.example.com
  User your_user
  Port 22
  IdentityFile ~/.ssh/id_ed25519

# 弱网（用 mosh 代替）
Host field-device
  HostName 192.168.10.2
  User root
  PreferredAuthentications publickey

# 一次性连接
Host one-off
  HostName 192.168.10.2
  User admin
  PasswordAuthentication yes
  PreferredAuthentications password
