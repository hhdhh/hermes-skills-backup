<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robox S2 装机控制台</title>
<style>
:root{color-scheme:dark;--bg:#08090a;--panel:#0f1011;--surface:#191a1b;--text:#f7f8f8;--secondary:#d0d6e0;--muted:#8a8f98;--faint:#62666d;--accent:#7170ff;--accent2:#5e6ad2;--danger:#ef6464;--success:#27a644;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.05)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,rgba(113,112,255,.16),transparent 34%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-feature-settings:"cv01","ss03"}button,input{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:280px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;padding:24px 18px;border-right:1px solid var(--border2);background:rgba(15,16,17,.88);backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:12px;padding:0 8px 24px}.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#8584ff,#4c54bd);display:grid;place-items:center;font-weight:600;box-shadow:0 0 30px rgba(113,112,255,.25)}.brand h1{font-size:15px;margin:0;font-weight:590}.brand p{font-size:11px;color:var(--muted);margin:3px 0 0}.nav-title{font-size:10px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase;margin:18px 10px 8px}.nav button{width:100%;border:0;color:var(--muted);background:transparent;padding:10px 12px;border-radius:7px;text-align:left;cursor:pointer;display:flex;justify-content:space-between}.nav button:hover,.nav button.active{background:rgba(255,255,255,.05);color:var(--text)}.nav small{color:var(--faint)}
.main{padding:30px clamp(22px,4vw,56px);min-width:0}.topbar{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:28px}.eyebrow{font:500 11px ui-monospace,monospace;color:var(--accent);letter-spacing:.09em;text-transform:uppercase}.topbar h2{font-size:32px;font-weight:510;letter-spacing:-.7px;margin:7px 0 8px}.subtitle{margin:0;color:var(--muted);max-width:720px;line-height:1.6}.status-pill{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:999px;padding:7px 11px;color:var(--secondary);font-size:12px;background:rgba(255,255,255,.02);white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 12px rgba(39,166,68,.7)}
.grid{display:grid;grid-template-columns:minmax(310px,.72fr) minmax(420px,1.28fr);gap:18px}.card{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:12px;overflow:hidden}.card-head{padding:17px 18px;border-bottom:1px solid var(--border2);display:flex;justify-content:space-between;align-items:center}.card-head h3{font-size:14px;margin:0;font-weight:590}.card-head span{font-size:11px;color:var(--faint)}.card-body{padding:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;color:var(--muted);margin:0 0 7px}.field input{width:100%;background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:10px 11px;outline:none}.field input:focus{border-color:rgba(113,112,255,.7);box-shadow:0 0 0 3px rgba(113,112,255,.12)}.field input.invalid{border-color:var(--danger)}.hint{font-size:11px;color:var(--faint);margin-top:6px}.actions{display:flex;gap:10px;margin-top:16px}.btn{border:1px solid var(--border);border-radius:6px;padding:9px 13px;color:var(--secondary);background:rgba(255,255,255,.03);cursor:pointer}.btn:hover{background:rgba(255,255,255,.06);color:var(--text)}.btn.primary{background:var(--accent2);border-color:transparent;color:#fff}.btn.primary:hover{background:#828fff}.btn.danger{color:#ffaaaa}.btn:disabled{opacity:.45;cursor:not-allowed}
.search{margin-bottom:12px}.search input{width:100%;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:7px;padding:10px 12px;color:var(--text)}.tabs{display:flex;gap:5px;margin-bottom:12px}.tab{padding:7px 10px;border:0;border-radius:6px;color:var(--muted);background:transparent;cursor:pointer}.tab.active{color:var(--text);background:rgba(255,255,255,.06)}.stage-list{max-height:530px;overflow:auto;padding-right:4px}.stage{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;border:1px solid transparent;border-radius:8px;padding:11px 10px;cursor:pointer}.stage:hover{background:rgba(255,255,255,.035);border-color:var(--border2)}.stage.selected{background:rgba(113,112,255,.1);border-color:rgba(113,112,255,.3)}.stage-index{font:11px ui-monospace,monospace;color:var(--faint);padding-top:2px}.stage-title{font-size:13px;font-weight:510}.stage-desc{font-size:11px;line-height:1.45;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.badge{font-size:10px;border:1px solid var(--border);padding:3px 6px;border-radius:999px;color:var(--faint)}.badge.warn{color:#ffb4b4;border-color:rgba(239,100,100,.25)}
.runner{grid-column:1/-1}.runner-top{display:flex;justify-content:space-between;gap:16px;align-items:center}.selected-title{font-size:14px;font-weight:590}.selected-desc{color:var(--muted);font-size:12px;margin-top:5px}.runner-actions{display:flex;gap:8px}.terminal{height:320px;overflow:auto;margin-top:15px;border:1px solid var(--border);border-radius:8px;background:#050606;padding:14px;color:#cdd5de;font:12px/1.55 "JetBrains Mono",ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}.terminal.empty{color:var(--faint)}.progress{height:2px;background:rgba(255,255,255,.05)}.progress>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}.progress.running>i{width:65%;animation:pulse 1.8s infinite}.progress.done>i{width:100%;background:var(--success)}.progress.fail>i{width:100%;background:var(--danger)}@keyframes pulse{50%{opacity:.45}}
.toast{position:fixed;right:24px;bottom:24px;max-width:420px;background:#202125;border:1px solid var(--border);padding:12px 14px;border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.4);display:none;font-size:13px}.toast.show{display:block}.toast.error{border-color:rgba(239,100,100,.4);color:#ffc4c4}.mobile-menu{display:none}
@media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--border2);padding:14px 18px}.brand{padding:0}.nav,.nav-title{display:none}.main{padding:22px}.grid{grid-template-columns:1fr}.runner{grid-column:auto}.topbar h2{font-size:27px}}@media(max-width:600px){.topbar{display:block}.status-pill{margin-top:14px;width:max-content}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.runner-top{align-items:flex-start;flex-direction:column}.terminal{height:280px}.actions{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="logo">R</div><div><h1>Robox S2 Console</h1><p>Setup & Integration Wizard</p></div></div><div class="nav-title">工作区</div><nav class="nav"><button class="active">装机控制台 <small>01</small></button><button id="navConfig">本机参数 <small>02</small></button><button id="navLogs">执行日志 <small>03</small></button></nav><div class="nav-title">安全</div><nav class="nav"><button id="clearSecrets">清除敏感输入 <small>⌫</small></button></nav></aside>
<main class="main"><header class="topbar"><div><div class="eyebrow">Autolife production tooling</div><h2>机器人装机控制台</h2><p class="subtitle">集中配置基础参数，选择单个装机或集成测试阶段，并实时查看执行输出。高风险操作在启动前会再次确认。</p></div><div class="status-pill"><span class="dot"></span><span id="serviceStatus">正在连接本机服务</span></div></header>
<div class="grid">
<section class="card" id="configCard"><div class="card-head"><h3>本机参数</h3><span id="configSource">等待检测</span></div><div class="card-body"><div class="form-grid">
<div class="field"><label for="robotId">机器人 ID</label><input id="robotId" maxlength="3" inputmode="numeric" placeholder="例如 012"><div class="hint">三位数字</div></div>
<div class="field"><label for="rosDomainId">ROS_DOMAIN_ID</label><input id="rosDomainId" inputmode="numeric" placeholder="0"><div class="hint">0—232</div></div>
<div class="field"><label for="lan0Mac">lan0 MAC · 路由器</label><input id="lan0Mac" placeholder="aa:bb:cc:dd:ee:ff"></div>
<div class="field"><label for="lan1Mac">lan1 MAC · 5G 模块</label><input id="lan1Mac" placeholder="aa:bb:cc:dd:ee:ff"></div>
<div class="field full"><label for="remoteSignalingUrl">远程信令地址</label><input id="remoteSignalingUrl" placeholder="ws://127.0.0.1:3000/ws"></div>
<div class="field"><label for="routerPassword">路由器密码</label><input id="routerPassword" type="password" autocomplete="off" placeholder="仅本次任务使用"></div>
<div class="field"><label for="sudoPassword">sudo 密码</label><input id="sudoPassword" type="password" autocomplete="off" placeholder="不写入磁盘"></div>
</div><div class="actions"><button class="btn" id="detectBtn">重新检测</button><button class="btn" id="clearBtn">清空表单</button></div></div></section>
<section class="card"><div class="card-head"><h3>任务阶段</h3><span id="stageCount">0 项</span></div><div class="card-body"><div class="tabs"><button class="tab active" data-tab="setup">装机配置</button><button class="tab" data-tab="integration">集成测试</button></div><div class="search"><input id="stageSearch" placeholder="搜索阶段名称或说明…"></div><div class="stage-list" id="stageList"></div></div></section>
<section class="card runner" id="runnerCard"><div class="progress" id="progress"><i></i></div><div class="card-body"><div class="runner-top"><div><div class="selected-title" id="selectedTitle">请选择一个任务阶段</div><div class="selected-desc" id="selectedDesc">点击右侧列表中的任务查看说明并执行。</div></div><div class="runner-actions"><button class="btn primary" id="runBtn" disabled>执行任务</button><button class="btn danger" id="stopBtn" disabled>停止</button><button class="btn" id="copyBtn">复制日志</button></div></div><pre class="terminal empty" id="terminal">尚未执行任务。</pre></div></section>
</div></main></div><div class="toast" id="toast"></div>
<script>
const state={manifest:{setupStages:[],integrationStages:[]},tab:'setup',selected:null,job:null,timer:null};
const $=id=>document.getElementById(id);const fields=['robotId','rosDomainId','lan0Mac','lan1Mac','remoteSignalingUrl','routerPassword','sudoPassword'];
function toast(message,error=false){const el=$('toast');el.textContent=message;el.className='toast show'+(error?' error':'');setTimeout(()=>el.className='toast',4200)}
async function jsonFetch(url,options){const r=await fetch(url,options);let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);return data}
function config(){return Object.fromEntries(fields.filter(x=>x!=='sudoPassword').map(x=>[x,$(x).value.trim()]))}
function validate(){fields.forEach(x=>$(x).classList.remove('invalid'));const c=config();let errors=[];if(c.robotId&&!/^\d{3}$/.test(c.robotId)){errors.push('机器人 ID 必须是三位数字');$('robotId').classList.add('invalid')}const domain=Number(c.rosDomainId);if(c.rosDomainId&&(!/^\d+$/.test(c.rosDomainId)||domain<0||domain>232)){errors.push('ROS_DOMAIN_ID 必须在 0—232');$('rosDomainId').classList.add('invalid')}for(const key of ['lan0Mac','lan1Mac'])if(c[key]&&!/^[0-9a-f]{2}(?::[0-9a-f]{2}){5}$/i.test(c[key])){errors.push(`${key} 格式无效`);$(key).classList.add('invalid')}if(c.lan0Mac&&c.lan0Mac.toLowerCase()===c.lan1Mac.toLowerCase()){errors.push('lan0 与 lan1 MAC 不能相同');$('lan0Mac').classList.add('invalid');$('lan1Mac').classList.add('invalid')}if(c.remoteSignalingUrl&&!/^wss?:\/\//.test(c.remoteSignalingUrl)){errors.push('信令地址必须以 ws:// 或 wss:// 开头');$('remoteSignalingUrl').classList.add('invalid')}if(errors.length)toast(errors[0],true);return !errors.length}
function currentStages(){return state.tab==='setup'?state.manifest.setupStages:state.manifest.integrationStages}
function renderStages(){const q=$('stageSearch').value.trim().toLowerCase();const stages=currentStages().filter(s=>(s.title+' '+s.description).toLowerCase().includes(q));$('stageCount').textContent=`${stages.length} 项`;$('stageList').innerHTML=stages.map((s,i)=>`<article class="stage ${state.selected?.key===s.key?'selected':''}" data-key="${s.key}"><div class="stage-index">${String(i+1).padStart(2,'0')}</div><div><div class="stage-title">${escapeHtml(s.title)}</div><div class="stage-desc">${escapeHtml(s.description||'执行该独立任务阶段并返回实时日志。')}</div></div><span class="badge ${s.dangerous?'warn':''}">${s.dangerous?'谨慎':'检查'}</span></article>`).join('')||'<div class="hint">没有匹配的阶段。</div>';document.querySelectorAll('.stage').forEach(el=>el.onclick=()=>selectStage(el.dataset.key))}
function selectStage(key){state.selected=currentStages().find(s=>s.key===key);$('selectedTitle').textContent=state.selected.title;$('selectedDesc').textContent=state.selected.description||'执行该独立任务阶段并返回实时日志。';$('runBtn').disabled=!!state.job&&state.job.status==='running';renderStages();$('runnerCard').scrollIntoView({behavior:'smooth',block:'nearest'})}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function detect(){try{$('detectBtn').disabled=true;const data=await jsonFetch('/api/local-config');for(const [k,v] of Object.entries(data.config||{}))if($(k)&&v&&!$(k).value)$(k).value=v;$('configSource').textContent=`检测到 ${(data.interfaces||[]).length} 个有线网卡`;toast('本机参数检测完成')}catch(e){toast(`检测失败：${e.message}`,true)}finally{$('detectBtn').disabled=false}}
async function run(){if(!state.selected||!validate())return;if(state.selected.dangerous&&!confirm(`“${state.selected.title}”可能修改系统、网络或启动硬件动作。\n\n确认现在执行？`))return;try{$('runBtn').disabled=true;$('terminal').classList.remove('empty');$('terminal').textContent='正在启动…\n';$('progress').className='progress running';const payload={stageKey:state.selected.key,config:config(),sudoPassword:$('sudoPassword').value};state.job=await jsonFetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});$('stopBtn').disabled=false;poll()}catch(e){toast(`启动失败：${e.message}`,true);$('terminal').textContent=`启动失败：${e.message}`;$('progress').className='progress fail';$('runBtn').disabled=false}}
async function poll(){if(!state.job)return;try{const job=await jsonFetch(`/api/job?id=${encodeURIComponent(state.job.id)}`);state.job=job;$('terminal').textContent=job.output||'任务运行中…';$('terminal').scrollTop=$('terminal').scrollHeight;if(job.status==='running'){state.timer=setTimeout(poll,700);return}$('progress').className=`progress ${job.status}`;$('stopBtn').disabled=true;$('runBtn').disabled=false;toast(job.status==='done'?'任务执行完成':`任务失败，退出码 ${job.returncode}`,job.status!=='done')}catch(e){toast(`日志刷新失败：${e.message}`,true);state.timer=setTimeout(poll,1600)}}
async function stop(){if(!state.job)return;try{await jsonFetch('/api/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:state.job.id})});toast('已发送停止请求')}catch(e){toast(e.message,true)}}
async function boot(){try{state.manifest=await jsonFetch('/api/manifest');$('serviceStatus').textContent='本机服务已连接';renderStages();detect()}catch(e){$('serviceStatus').textContent='服务不可用';toast(`无法加载任务列表：${e.message}`,true)}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.tab=b.dataset.tab;state.selected=null;$('selectedTitle').textContent='请选择一个任务阶段';$('selectedDesc').textContent='点击列表中的任务查看说明并执行。';$('runBtn').disabled=true;renderStages()});$('stageSearch').oninput=renderStages;$('detectBtn').onclick=detect;$('runBtn').onclick=run;$('stopBtn').onclick=stop;$('copyBtn').onclick=async()=>{await navigator.clipboard.writeText($('terminal').textContent);toast('日志已复制')};$('clearBtn').onclick=()=>fields.forEach(x=>$(x).value='');$('clearSecrets').onclick=()=>{['routerPassword','sudoPassword'].forEach(x=>$(x).value='');toast('敏感输入已清除')};$('navConfig').onclick=()=>$('configCard').scrollIntoView({behavior:'smooth'});$('navLogs').onclick=()=>$('runnerCard').scrollIntoView({behavior:'smooth'});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')run()});boot();window.roboxWizardFrontendState=state;
</script>
</body>
</html>
