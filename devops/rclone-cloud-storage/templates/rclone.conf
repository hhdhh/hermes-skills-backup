# rclone configuration — self-hosted S3-compatible object store with self-signed cert
# 1. Save as ~/.config/rclone/rclone.conf  (Linux/macOS)
#    or  %APPDATA%\rclone\rclone.conf       (Windows)
# 2. chmod 600 it on Linux/macOS.  Set owner-only ACL on Windows.
# 3. Replace <remote-name>, <AK>, <SK>, <host>:<port> with the values from your operator.
# 4. Test with: rclone lsd <remote>:

[<remote-name>]
type = s3
provider = Other
env_auth = false
access_key_id = <AK>
secret_access_key = <SK>
endpoint = https://<host>:<port>
force_path_style = true
no_check_certificate = true
